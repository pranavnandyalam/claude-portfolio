# Hard risk limits. The engine refuses to start if any value fails Limits.validate().
# Claude sessions may PROPOSE changes to this file; a human commits them (git log is the audit trail).
strategy_version: "v1"
universe_max_names: 30
max_position_weight: 0.10      # of NAV, per name
max_gross_exposure: 1.00       # long-only, no margin
max_turnover_per_day: 0.25     # sum |order notional| / NAV
min_order_notional: 50.0       # skip dust
max_order_notional: 5000.0     # per order hard cap (Knight rule: cap every order)
max_orders_per_run: 60
drift_band_abs: 0.005          # 0.5% of NAV
drift_band_rel: 0.20           # 20% of target weight
price_sanity_tol: 0.03         # yfinance close vs broker price
daily_loss_halt: 0.03          # vs last_equity: no new orders today
daily_loss_cancel: 0.05        # vs last_equity: also cancel open orders
dd_l1: 0.05                    # from peak: de-risk to 50% gross
dd_l2: 0.10                    # sells only
dd_l3: 0.15                    # flatten + hard halt, human reset only
l1_reset_dd: 0.03
l2_reset_sessions: 5
order_fill_wait_s: 900
lock_stale_hours: 6.0
