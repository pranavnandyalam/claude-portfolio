[project]
name = "claude-portfolio"
version = "0.1.0"
description = "Claude-supervised, deterministic systematic portfolio on Alpaca (paper by default)"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.50",
  "alpaca-py>=0.30",
  "pyyaml>=6",
  "python-dotenv>=1",
  "requests>=2.31",
  "scipy>=1.11",
  "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.setuptools.packages.find]
include = ["portfolio*"]
